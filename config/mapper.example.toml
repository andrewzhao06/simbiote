[paths]
# Change this to the actual SSD mount point on the GB10.
ssd_root = "/mnt/factoryflow-ssd"
work_root = "/var/factoryflow/stage/mapper"
models_root = "/mnt/factoryflow-ssd/models"
tools_root = "/mnt/factoryflow-ssd/tools"
colmap_binary = "/usr/local/bin/colmap"
ffprobe_binary = "/usr/bin/ffprobe"
depth_checkpoint = "/mnt/factoryflow-ssd/models/depth-anything"
sam3_checkpoint = "/mnt/factoryflow-ssd/models/sam3"
dgrut_root = "/mnt/factoryflow-ssd/tools/3dgrut"
hospital_usd = "/mnt/factoryflow-ssd/assets/hospital/hospital.usd"

[pipeline]
# Use "proxy" to test capture parsing and the Step 2 USD contract without geometry.
# Use "preview" for CPU-only LiDAR point-cloud geometry from a Stray Scanner capture.
# Use "production" only after all four adapter commands described in README.md are set.
mode = "proxy"
depth_scale_meters = 0.001
confidence_threshold = 1
