[project]
name = "factoryflow-teleop"
version = "0.1.0"
description = "FactoryFlow Step 3 -- hand-tracking teleoperation (Teammate 3)"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9",
    "mediapipe>=0.10",
    "numpy>=1.26",
    "pybullet>=3.2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factoryflow*"]
