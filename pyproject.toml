[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simbiote"
version = "0.2.0"
description = "Simbiote — offline scan/sim/RL platform for mobile manipulators (Dell x NVIDIA GB10 hackathon): physics/sim/training (Suraj), hand-tracking teleop (Sky), agentic/LLM control (Andrew)"
requires-python = ">=3.10"

[project.scripts]
simbiote-agentic = "simbiote.agentic.agentic_session:main"

[tool.setuptools.packages.find]
include = ["simbiote*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["Suraj/tests", "Sky/tests", "Andrew/tests"]
markers = [
    "slow: longer-running tests (real PPO convergence, multi-episode rollouts) -- excluded by default via `-m \"not slow\"` in CI-speed runs",
]
