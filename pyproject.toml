[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factoryflow-mapper"
version = "0.1.0"
description = "FactoryFlow Teammate 1 scan-to-OpenUSD pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy",
  "Pillow",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]
usd = [
  "usd-core>=24.11",
]

[project.scripts]
factoryflow-map = "factoryflow_mapper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factoryflow_mapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
